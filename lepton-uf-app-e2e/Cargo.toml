[package]
name = "lepton-uf-app-e2e"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false
description = "Product Leptos host that mounts lepton-uf-app crates for Playwright"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Product crates under test.
lepton-shell = { workspace = true, default-features = false }
lepton-app = { workspace = true }
lepton-auth-app = { workspace = true }
uf-product = { workspace = true, default-features = false }
uf-integrations = { workspace = true, default-features = false }

# Kit: identity, session middleware, delivery adapters.
lepton-auth = { workspace = true, default-features = false }
lepton-auth-ui = { workspace = true, default-features = false }
lepton-host-adapter = { workspace = true, default-features = false, optional = true, features = ["db-sqlite"] }
lepton-identity = { workspace = true, default-features = false, optional = true, features = ["db-sqlite"] }
lepton-smtp = { workspace = true, optional = true }
lepton-sms = { workspace = true, optional = true }
# Harness sidecars (mock OIDC, SMS sink) and the seed HTTP handler.
lepton-e2e = { workspace = true, optional = true, default-features = false }
lepton-test-support = { workspace = true, optional = true, default-features = false, features = ["axum"] }
# Delivery settings (P27): Neutrino-backed settings, the gated page's backend, and Gauge permissions.
gauge = { workspace = true, optional = true, features = ["ssr"] }
neutrino = { workspace = true, optional = true, features = ["ssr"] }
uf-lepton-delivery-boot = { workspace = true, optional = true }

leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
leptos_axum = { workspace = true, optional = true, default-features = true }

cfg-if = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }

async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
axum-login = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
tower-http = { version = "0.6", optional = true, features = ["fs"] }
tower-sessions = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
higgs = { workspace = true, optional = true }
higgs-identity = { workspace = true, optional = true }
valence = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { workspace = true, optional = true }
tracing-wasm = { version = "0.2", optional = true }

[features]
default = []
# OAuth link / sign-in CTAs on the product surfaces. The harness always runs with
# the mock IdP, so both providers stay on for hydrate and ssr.
oauth-google = [
    "lepton-app/oauth-google",
    "lepton-auth-app/oauth-google",
    "lepton-auth/oauth-google",
    "lepton-auth-ui/oauth-google",
]
oauth-github = [
    "lepton-app/oauth-github",
    "lepton-auth-app/oauth-github",
    "lepton-auth/oauth-github",
    "lepton-auth-ui/oauth-github",
]
# Passkey UI in Account Settings. `lepton-auth/webauthn` (server side) is on `ssr`.
webauthn = ["lepton-app/webauthn"]
hydrate = [
    "leptos/hydrate",
    "lepton-shell/hydrate",
    "lepton-app/hydrate",
    "lepton-auth-app/hydrate",
    "uf-product/hydrate",
    "uf-integrations/hydrate",
    "lepton-auth/hydrate",
    "lepton-auth-ui/hydrate",
    "oauth-google",
    "oauth-github",
    "webauthn",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:tracing-wasm",
]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "dep:axum",
    "dep:axum-login",
    "dep:tokio",
    "dep:anyhow",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tower-http",
    "dep:tower-sessions",
    "dep:higgs",
    "dep:higgs-identity",
    "dep:valence",
    "dep:chrono",
    "dep:async-trait",
    "dep:reqwest",
    "dep:lepton-host-adapter",
    "dep:lepton-identity",
    "dep:lepton-smtp",
    "dep:lepton-sms",
    "dep:lepton-e2e",
    "dep:lepton-test-support",
    "dep:gauge",
    "dep:neutrino",
    "dep:uf-lepton-delivery-boot",
    "higgs/ssr",
    "lepton-shell/ssr",
    "lepton-app/ssr",
    "lepton-auth-app/ssr",
    "uf-product/ssr",
    "uf-integrations/ssr",
    "lepton-auth/ssr",
    "lepton-auth/email",
    "lepton-auth/phone",
    "lepton-auth/totp",
    "lepton-auth/webauthn",
    "lepton-auth-ui/ssr",
    "lepton-host-adapter/ssr",
    "oauth-google",
    "oauth-github",
    "webauthn",
]

[[bin]]
name = "lepton-uf-app-e2e"
path = "src/main.rs"
required-features = ["ssr"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[lints]
workspace = true
