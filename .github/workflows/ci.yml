# PR / merge gate aligned with docs/VERIFICATION.md.
# Standalone checkout — UF deps resolve via git branch = main on unified-field-dev.
# Private lepton checkout is e2e-only (Mailpit compose).
#
# Pull requests: `pull_request` runs for branches on unified-field-dev/lepton-uf-app.
# Fork PRs need a same-repo branch on uf-dev or fork-workflow approval in Settings.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1
  CARGO_TARGET_DIR: target-lepton-uf-app
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: 1
  # Leptos workspace deps enable the `nightly` feature.
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
          components: rustfmt
      - name: cargo fmt --check
        run: >
          cargo fmt
          -p lepton-shell -p lepton-app -p lepton-auth-app -p lepton-mount-host
          -p lepton-uf-app-e2e
          -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
          components: clippy
      - name: cargo clippy (product crates, ssr)
        run: >
          cargo clippy
          -p lepton-shell -p lepton-app -p lepton-auth-app
          --features ssr --all-targets -- -D warnings
      - name: cargo clippy (lepton-uf-app-e2e, ssr)
        run: >
          cargo clippy -p lepton-uf-app-e2e --features ssr --all-targets
          -- -D warnings
      - name: cargo clippy (lepton-mount-host)
        run: cargo clippy -p lepton-mount-host --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
      - name: cargo check (product crates + mount host + e2e)
        run: |
          cargo check -p lepton-shell -p lepton-app -p lepton-auth-app --features ssr
          cargo check -p lepton-mount-host
          cargo check -p lepton-uf-app-e2e --features ssr
      - name: cargo run (lepton-mount-host)
        run: cargo run -p lepton-mount-host
      - name: cargo test (profile units + lepton-shell surfaces)
        run: |
          cargo test -p lepton-app --features ssr --lib -- validate_display_name
          cargo test -p lepton-shell --features ssr --test workspace_members
          cargo test -p lepton-shell --features ssr --test shell_step_up_surface
          cargo test -p lepton-shell --features ssr --test product_surface

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout lepton (Mailpit / private kit)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: unified-field-dev/lepton
          path: lepton
          ssh-key: ${{ secrets.LEPTON_CLONE_SSH_KEY }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
      - name: Install cargo-leptos
        run: cargo install cargo-leptos --locked --version 0.3.6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: lepton-uf-app-e2e/end2end/package-lock.json
      - name: Install npm dependencies
        working-directory: lepton-uf-app-e2e/end2end
        run: npm ci
      - name: Get Playwright version
        id: pw-version
        working-directory: lepton-uf-app-e2e/end2end
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}-uf-app
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: lepton-uf-app-e2e/end2end
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps when cache hit
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: lepton-uf-app-e2e/end2end
        run: npx playwright install-deps chromium
      - name: Start Mailpit
        working-directory: lepton
        run: docker compose -f infra/mailpit/docker-compose.yml up -d
      - name: Wait for Mailpit API
        run: |
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:8025/api/v1/info" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Mailpit did not become ready" >&2
          exit 1
      - name: cargo leptos end-to-end
        env:
          CI: true
        run: cargo leptos end-to-end --split --project lepton-uf-app-e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-uf-app-${{ github.run_id }}
          path: |
            lepton-uf-app-e2e/end2end/playwright-report/
            lepton-uf-app-e2e/end2end/test-results/
          if-no-files-found: ignore

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
      - name: cargo doc (product crates, deny warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p lepton-shell -p lepton-app -p lepton-auth-app --features ssr --no-deps

  leptos-lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
      - name: Install cargo-dylint
        run: |
          cargo install cargo-dylint --locked --version 6.0.1 --force
          cargo install dylint-link --locked --version 6.0.1 --force
      # leptos-lints@v0.1.2 pins nightly-2025-05-14; lint hydrate UI crates with
      # `--no-deps` where Leptos API lints apply.
      - name: Install leptos-lints nightly toolchain
        run: rustup toolchain install nightly-2025-05-14 --component rustc-dev,llvm-tools-preview
      - name: cargo dylint (leptos-lints)
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
          RUSTFLAGS: "-D warnings -Zcrate-attr=feature(stdarch_x86_avx512)"
        run: |
          cargo dylint --all -p lepton-app --no-deps -- --features hydrate
          cargo dylint --all -p lepton-auth-app --no-deps -- --features hydrate
          cargo dylint --all -p lepton-shell --no-deps -- --features hydrate
