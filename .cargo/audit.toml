[advisories]
# RUSTSEC-2023-0071 (rsa): Marvin Attack timing sidechannel, no fixed upgrade
# available upstream.
#
# RUSTSEC-2026-0119 (hickory-proto) is intentionally NOT ignored: it has a
# real fix (hickory-proto >=0.26.1), but lepton-smtp pins
# hickory-resolver = "^0.24", which caps it below that (lepton-uf-app depends
