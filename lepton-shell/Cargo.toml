[package]
name = "lepton-shell"
version = "0.2.0"
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Auth app-bar UI composed into uf-integrations ShellAuthMenu slot"

[dependencies]
leptos = { workspace = true }
leptos_router = { workspace = true }
lepton-auth = { workspace = true, default-features = false }
lepton-auth-ui = { workspace = true, default-features = false }
orbital-base-components = { workspace = true }
orbital-primitives = { workspace = true, default-features = false }
orbital-core-components = { workspace = true }
icondata = { workspace = true }
uf-product = { workspace = true, default-features = false }
uf-product-macros = { workspace = true }
uf-search-core = { workspace = true }
valence = { workspace = true, optional = true }
lepton-identity = { workspace = true, optional = true }
spectra = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde = { workspace = true }
inventory = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
# Force crc32fast 1.5.0 through the dylint graph (see workspace pin).
crc32fast = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true

[features]
default = []
hydrate = ["leptos/hydrate", "lepton-auth/hydrate", "lepton-auth-ui/hydrate", "uf-product/hydrate", "orbital-core-components/hydrate"]
ssr = [
    "leptos/ssr",
    "leptos_router/ssr",
    "lepton-auth/ssr",
    "lepton-auth-ui/ssr",
    "uf-product/ssr",
    "uf-search-core/ssr",
    "orbital-core-components/ssr",
    "dep:valence",
    "dep:lepton-identity",
    "dep:spectra",
    "dep:serde_json",
    "dep:inventory",
    "dep:chrono"]
